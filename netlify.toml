# Netlify build configuration for this Next.js (App Router) portfolio.
# Values in this file override the site's build settings in the Netlify UI,
# so the deployment can no longer be resolved incorrectly from the dashboard.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 requires Node >= 20.9.0; pinned for reproducible builds.
  NODE_VERSION = "22"

# Explicitly declare the official Next.js runtime so every build installs
# it fresh from npm (guarding against stale/missing plugin state).
[[plugins]]
  package = "@netlify/plugin-nextjs"
